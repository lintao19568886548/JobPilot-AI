<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobPilot AI 申请助手</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">JOBPILOT AI</p>
          <h1>申请助手</h1>
        </div>
        <span id="connectionBadge" class="badge">未配对</span>
      </header>

      <section id="pairingPanel" class="section">
        <div class="section-heading">
          <div><span class="step">01</span><h2>安全配对</h2></div>
          <p>在 JobPilot「浏览器扩展」页面创建一次性配对码。</p>
        </div>
        <label for="pairingCode">配对码</label>
        <input id="pairingCode" autocomplete="one-time-code" maxlength="32" placeholder="JP-XXXX-XXXX" />
        <button id="pairButton" class="primary" type="button">连接 JobPilot</button>
      </section>

      <section id="capturePanel" class="section hidden">
        <div class="section-heading">
          <div><span class="step">02</span><h2>读取当前页面</h2></div>
          <p>仅在点击后读取当前页面可见的岗位字段，保存前可修改。</p>
        </div>
        <div id="scopeSummary" class="scope-summary"></div>
        <button id="extractButton" class="primary" type="button">提取当前可见岗位</button>
        <div id="captureForm" class="form-grid hidden">
          <label for="jobTitle">职位名称</label><input id="jobTitle" maxlength="200" />
          <label for="companyName">公司</label><input id="companyName" maxlength="200" />
          <label for="city">城市</label><input id="city" maxlength="100" />
          <label for="salaryText">薪资</label><input id="salaryText" maxlength="120" />
          <label for="descriptionText">职位描述</label><textarea id="descriptionText" maxlength="20000" rows="9"></textarea>
          <div id="captureWarnings" class="notice"></div>
          <button id="saveButton" class="primary" type="button">确认并保存岗位</button>
        </div>
      </section>

      <section id="workspacePanel" class="section hidden">
        <div class="section-heading">
          <div><span class="step">03</span><h2>分析与准备</h2></div>
          <p>创建匹配、草稿与 Assist 队列；所有外部操作仍由你确认。</p>
        </div>
        <div class="actions">
          <button id="analyzeButton" type="button">分析匹配</button>
          <button id="draftButton" type="button">生成沟通草稿</button>
          <button id="queueButton" type="button">加入 Assist 队列</button>
          <button id="refreshButton" type="button">刷新</button>
        </div>
        <div id="workspaceSummary" class="summary"></div>
        <button id="openButton" class="link-button" type="button">在 JobPilot 中查看完整详情 →</button>
      </section>

      <footer>
        <strong>安全边界</strong>
        <span>不会读取密码、Cookie、验证码或隐藏字段；不会自动发送消息或提交申请。</span>
      </footer>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
